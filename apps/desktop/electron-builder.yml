# Packaging for Windows, macOS and Linux.
# Code signing and notarization need certificates (see docs/deployment.md);
# without them the builds work but show OS warnings and cannot auto-update on macOS.
appId: ai.meetingassistant.desktop
productName: Meeting Assistant
copyright: Copyright © 2026 Meeting Assistant
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  # Only the compact English model is used.
  - '!node_modules/@tesseract.js-data/eng/4.0.0/**'
extraResources:
  - from: resources
    to: .
    filter: ['*.png']
asarUnpack:
  - node_modules/sherpa-onnx-*/**
  - node_modules/audiotee/bin/**
  # The slide reader runs in a worker thread and loads its WebAssembly and English data from disk.
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/eng/4.0.0_best_int/**
npmRebuild: false
afterPack: scripts/verify-native.cjs
publish:
  provider: github
  owner: aasimsyed-ai
  repo: meeting-bot
  releaseType: draft

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Meeting-Assistant-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  shortcutName: Meeting Assistant

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: Meeting-Assistant-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: '12.0'
  extendInfo:
    NSMicrophoneUsageDescription: Meeting Assistant uses your microphone to capture what you say in meetings, only while you are taking notes.
    NSAudioCaptureUsageDescription: Meeting Assistant listens to meeting audio so it can take notes, only while you are taking notes.
    NSScreenCaptureUsageDescription: Meeting Assistant looks at window titles to notice when you are in a meeting, and reads the text on shared slides while you are taking notes. Pictures are never saved.
    LSUIElement: false
dmg:
  title: Meeting Assistant ${version}

linux:
  executableName: meeting-assistant
  target:
    - AppImage
    - deb
  category: Office
  artifactName: Meeting-Assistant-${version}-${arch}.${ext}
  maintainer: Meeting Assistant
