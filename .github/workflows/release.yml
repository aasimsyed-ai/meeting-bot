name: Release

# Builds installers for a version tag and attaches them to a draft GitHub release.
# Signing secrets are optional; without them the installers are unsigned.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install the speech engine for both Mac architectures
        # pnpm installs native binaries only for the current CPU; the x64 build needs its own.
        if: runner.os == 'macOS'
        run: |
          printf 'supportedArchitectures:\n  os: [current]\n  cpu: [arm64, x64]\n' >> ../../pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build and publish (draft release)
        run: pnpm exec electron-vite build && pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization (optional)
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (optional)
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
      - name: Bundle the Windows installer with the double-click files
        if: runner.os == 'Windows'
        # One ZIP for people who want a single download: the installer plus windows/ (Install.cmd,
        # Open.cmd, Uninstall.cmd, README.txt). Added to the same draft release.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem "release\$version\Meeting-Assistant-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw 'The Windows installer was not built' }
          $stage = Join-Path $env:RUNNER_TEMP 'Meeting-Assistant-Windows'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item ..\..\windows\* $stage
          Copy-Item $setup.FullName $stage
          $name = "Meeting-Assistant-Windows-$version.zip"
          $zip = Join-Path $env:RUNNER_TEMP $name
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tag_name -eq "v$version" } | Select-Object -First 1
          if (-not $release) { throw "No release for v$version was found" }
          gh api --method POST "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=$name" -H 'Content-Type: application/zip' --input $zip
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the ZIP failed' }
